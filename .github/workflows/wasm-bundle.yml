# Builds the WebAssembly web page with both architectures: build-wasm/web
# from make wasm WASM_WEB_ARCHS="wasm64 wasm32", plus the README.txt and
# serve.py of emscripten/deploy.  The bundle is uploaded as the
# workflow artifact chicken-wasm-web-<rev> and, for main, deployed to the
# docs/ folder of the gh-pages branch, which GitHub Pages serves (Settings
# > Pages > Deploy from a branch: gh-pages, /docs).
#
# gh-pages holds one commit, replaced (force-pushed) by each deploy: the
# modules are about 20 MB, which a history would keep for every deploy.
# Its Source: trailer names the commit of main it was built from, and a
# deploy of an older commit (a re-run of an old run) is refused.
name: WebAssembly bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request cancels the older run; on main the
# newer run waits, so a built bundle is always deployed.
concurrency:
  group: wasm-bundle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # the version the README says the build is tested with
  EMSDK_VERSION: 6.0.10

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      rev: ${{ steps.boot.outputs.rev }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the bootstrap snapshot version
        id: boot
        run: |
          version=$(sed -n 's/^BOOTVERSION=//p' scripts/bootstrap.sh)
          url=$(sed -n 's/^BOOTURL=//p' scripts/bootstrap.sh | sed "s/\${BOOTVERSION}/$version/")
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "url=https://code.call-cc.org/dev-snapshots/$url" >>"$GITHUB_OUTPUT"
          echo "rev=$(git rev-parse --short HEAD)" >>"$GITHUB_OUTPUT"

      - name: Cache the bootstrap snapshot
        id: snapshot-cache
        uses: actions/cache@v4
        with:
          path: ~/chicken-snapshot
          key: chicken-snapshot-${{ steps.boot.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build the bootstrap snapshot
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot" && cd "$RUNNER_TEMP/snapshot"
          wget -qO- "${{ steps.boot.outputs.url }}" | tar -xz
          cd "chicken-${{ steps.boot.outputs.version }}"
          ./configure --prefix "$HOME/chicken-snapshot"
          make -j"$(nproc)"
          make install

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build the host CHICKEN
        run: |
          ./configure --chicken "$HOME/chicken-snapshot/bin/chicken"
          make -j"$(nproc)" boot-chicken
          make spotless
          ./configure --chicken ./chicken-boot
          make -j"$(nproc)"

      - name: Build wasm64 and wasm32
        run: |
          source ~/emsdk/emsdk_env.sh
          make -j"$(nproc)" wasm WASM_WEB_ARCHS="wasm64 wasm32"

      - name: Smoke test the node csi
        run: |
          source ~/emsdk/emsdk_env.sh
          # emsdk_env.sh puts emsdk's node in EMSDK_NODE, not on the PATH, and
          # the runner's own node is too old for wasm64 (memory64/table64).
          test "$(NODE="$EMSDK_NODE" build-wasm/node/csi -n -e '(display (+ 1 2))')" = 3

      - name: Assemble the bundle
        run: |
          mkdir -p bundle
          cp -R build-wasm/web/. bundle/
          cp emscripten/deploy/README.txt emscripten/deploy/serve.py bundle/
          test -f bundle/index.html -a -f bundle/chicken-repl.wasm -a -f bundle/wasm32/chicken-repl.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: chicken-wasm-web-${{ steps.boot.outputs.rev }}
          path: bundle/
          if-no-files-found: error

  deploy:
    needs: bundle
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chicken-wasm-web-${{ needs.bundle.outputs.rev }}
          path: ${{ runner.temp }}/bundle

      - name: Commit the bundle to gh-pages under docs/
        env:
          REV: ${{ needs.bundle.outputs.rev }}
          SITE: ${{ runner.temp }}/site
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git init -q -b gh-pages "$SITE"
          cd "$SITE"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git config http.extraheader "AUTHORIZATION: basic $auth"
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          mkdir docs
          cp -R "$RUNNER_TEMP/bundle/." docs/
          # served as is, with no Jekyll pass (which drops _-prefixed files)
          touch docs/.nojekyll
          git add -A
          tree=$(git write-tree)
          lease=refs/heads/gh-pages:          # no gh-pages yet
          if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
            old=$(git rev-parse FETCH_HEAD)
            lease=refs/heads/gh-pages:$old
            if [ "$(git rev-parse "$old^{tree}")" = "$tree" ]; then
              echo "gh-pages already has this bundle"
              exit 0
            fi
            src=$(git log -1 --format='%(trailers:key=Source,valueonly)' "$old")
            if [ -n "$src" ] && [ "$src" != "$GITHUB_SHA" ] &&
               git fetch -q --filter=tree:0 origin "$GITHUB_SHA" "$src" &&
               git merge-base --is-ancestor "$GITHUB_SHA" "$src"; then
              echo "::notice::gh-pages has $src, newer than $GITHUB_SHA: not deploying"
              exit 0
            fi
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Deploy the WebAssembly web page of $REV" \
              -m "Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." \
              -m "Source: $GITHUB_SHA"
          git push --force-with-lease="$lease" origin HEAD:refs/heads/gh-pages
          echo "Deployed $REV: $(git rev-parse --short HEAD)" >>"$GITHUB_STEP_SUMMARY"

      # A push made with GITHUB_TOKEN may not start the Pages build of a
      # branch-based site, so ask for one (also after a skipped deploy,
      # which retries a request that failed before)
      - name: Ask GitHub Pages to publish gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status ||
            echo "::warning::could not request a Pages build: is Pages set to deploy from gh-pages, /docs?"
