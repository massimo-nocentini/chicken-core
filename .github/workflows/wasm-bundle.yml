# Builds the WebAssembly web page with both architectures: build-wasm/web
# from make wasm WASM_WEB_ARCHS="wasm64 wasm32", plus the README.txt and
# serve.py of emscripten/deploy.  The bundle is uploaded as the
# workflow artifact chicken-wasm-web-<rev> and, for main, deployed by
# the deploy job to GitHub Pages, with the official Pages actions: the
# bundle is the root of the site, as docs/ of gh-pages was before, so
# the URLs are the same.  No branch holds the site, and there is no
# Jekyll pass (no .nojekyll needed).
#
# This needs, once, Settings > Pages > Build and deployment > Source:
# GitHub Actions (it was Deploy from a branch: gh-pages, /docs).  The
# github-pages environment must allow deployments from main (the
# default branch rule that Pages sets up does).  After the switch
# nothing reads the gh-pages branch, and it can be deleted.
#
# Each deployment is recorded in the github-pages environment with the
# commit of main it was built from, and a deploy of an older commit (a
# re-run of an old run) fails instead of replacing the newer site.
name: WebAssembly bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request cancels the older run; on main the
# newer run waits, so a built bundle is always deployed.
concurrency:
  group: wasm-bundle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # the version the README says the build is tested with
  EMSDK_VERSION: 6.0.10

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      rev: ${{ steps.boot.outputs.rev }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the bootstrap snapshot version
        id: boot
        run: |
          version=$(sed -n 's/^BOOTVERSION=//p' scripts/bootstrap.sh)
          url=$(sed -n 's/^BOOTURL=//p' scripts/bootstrap.sh | sed "s/\${BOOTVERSION}/$version/")
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "url=https://code.call-cc.org/dev-snapshots/$url" >>"$GITHUB_OUTPUT"
          echo "rev=$(git rev-parse --short HEAD)" >>"$GITHUB_OUTPUT"

      - name: Cache the bootstrap snapshot
        id: snapshot-cache
        uses: actions/cache@v4
        with:
          path: ~/chicken-snapshot
          key: chicken-snapshot-${{ steps.boot.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build the bootstrap snapshot
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot" && cd "$RUNNER_TEMP/snapshot"
          wget -qO- "${{ steps.boot.outputs.url }}" | tar -xz
          cd "chicken-${{ steps.boot.outputs.version }}"
          ./configure --prefix "$HOME/chicken-snapshot"
          make -j"$(nproc)"
          make install

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build the host CHICKEN
        run: |
          ./configure --chicken "$HOME/chicken-snapshot/bin/chicken"
          make -j"$(nproc)" boot-chicken
          make spotless
          ./configure --chicken ./chicken-boot
          make -j"$(nproc)"

      - name: Build wasm64 and wasm32
        run: |
          source ~/emsdk/emsdk_env.sh
          make -j"$(nproc)" wasm WASM_WEB_ARCHS="wasm64 wasm32"

      - name: Smoke test the node csi
        run: |
          source ~/emsdk/emsdk_env.sh
          # emsdk_env.sh puts emsdk's node in EMSDK_NODE, not on the PATH, and
          # the runner's own node is too old for wasm64 (memory64/table64).
          test "$(NODE="$EMSDK_NODE" build-wasm/node/csi -n -e '(display (+ 1 2))')" = 3

      - name: Assemble the bundle
        run: |
          mkdir -p bundle
          cp -R build-wasm/web/. bundle/
          cp emscripten/deploy/README.txt emscripten/deploy/serve.py bundle/
          test -f bundle/index.html -a -f bundle/chicken-repl.wasm -a -f bundle/wasm32/chicken-repl.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: chicken-wasm-web-${{ steps.boot.outputs.rev }}
          path: bundle/
          if-no-files-found: error

  # The Pages artifact is made here, from chicken-wasm-web-<rev>, not in
  # bundle: bundle does the same for every event, the Pages artifact is
  # made only after the check below lets it be deployed, and a re-run of
  # this job alone, even days later, still finds the bundle (kept 90
  # days) where a Pages artifact made by bundle would have expired (it
  # is kept 1 day).
  deploy:
    needs: bundle
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # pages and id-token (the OIDC token deploy-pages authenticates with)
    # to deploy; contents and deployments only to read, for the check
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # one deploy at a time, and one that started is never cancelled
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      # The deployments of the github-pages environment carry the commit
      # they were built from: the newest one of main that succeeded is the
      # site served now (the one of this job is still in progress).  If
      # that commit descends from this one, this is a re-run of an old
      # run, which must not put the older bundle back.  It fails rather
      # than succeed without deploying: a successful job would record a
      # deployment of this commit, and the next check would take it for
      # the site.  A live commit with no history in common (main was
      # rewritten, or its commit is gone) does not count as newer.
      - name: Refuse to replace a newer deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          api=repos/$GITHUB_REPOSITORY
          deployments=$(gh api "$api/deployments?environment=github-pages&ref=$GITHUB_REF_NAME&per_page=100" \
                          --jq '.[] | "\(.id) \(.sha)"')
          live=
          while read -r id sha; do
            [ -n "$id" ] || continue
            state=$(gh api "$api/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = success ]; then
              live=$sha
              break
            fi
          done <<<"$deployments"
          if [ -z "$live" ] || [ "$live" = "$GITHUB_SHA" ]; then
            exit 0
          fi
          if ! status=$(gh api "$api/compare/$GITHUB_SHA...$live?per_page=1" --jq .status 2>"$RUNNER_TEMP/compare.err"); then
            grep -qE 'HTTP (404|422)' "$RUNNER_TEMP/compare.err" || { cat "$RUNNER_TEMP/compare.err" >&2; exit 1; }
            status=unrelated
          fi
          if [ "$status" = ahead ]; then
            echo "::error::the site has $live, newer than $GITHUB_SHA: not deploying"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: chicken-wasm-web-${{ needs.bundle.outputs.rev }}
          path: ${{ runner.temp }}/bundle

      # fails early, and clearly, when Pages is not enabled
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/bundle

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summarize the deployment
        env:
          REV: ${{ needs.bundle.outputs.rev }}
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Deployed $REV: $URL" >>"$GITHUB_STEP_SUMMARY"
