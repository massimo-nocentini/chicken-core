# Docker images of CHICKEN for linux/amd64 and linux/arm64, one per
# branch, pushed to ghcr.io/<owner>/<repo>:<branch> (and :<branch>-<rev>;
# :latest is main).  Each platform is built natively on its own runner
# and the two are joined in one multi-platform manifest.
#
# master carries no workflows (it follows upstream), so its image is
# built from here.  A push to main builds main, and master too when
# master's revision has no image yet; the daily schedule builds either
# branch whose revision has no image; workflow_dispatch builds what it
# is asked to.  GitHub runs schedules (and offers workflow_dispatch)
# only for workflows on the default branch: both need main to be it.
name: Docker images

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      branches:
        description: Branches to build (space separated)
        default: main master

concurrency:
  group: docker-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.plan.outputs.image }}
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick the branches and revisions to build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BRANCHES: ${{ inputs.branches }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          case "$EVENT" in
            workflow_dispatch) branches=$INPUT_BRANCHES ;;
            *) branches="main master" ;;
          esac
          entries=()
          for b in $branches; do
            if [ "$EVENT" = push ] && [ "$b" = main ]; then
              sha=$GITHUB_SHA
            else
              sha=$(git ls-remote "$REPO_URL" "refs/heads/$b" | cut -f1)
            fi
            if [ -z "$sha" ]; then echo "::error::no branch $b"; exit 1; fi
            rev=$(echo "$sha" | cut -c1-8)
            # only the pushed branch and what was asked for are rebuilt
            # regardless; otherwise only a revision without an image
            if [ "$EVENT" != workflow_dispatch ] &&
               ! { [ "$EVENT" = push ] && [ "$b" = main ]; } &&
               docker buildx imagetools inspect "$image:$b-$rev" >/dev/null 2>&1; then
              echo "$b is at $rev, which already has an image"
              continue
            fi
            entries+=("{\"branch\":\"$b\",\"sha\":\"$sha\",\"rev\":\"$rev\"}")
          done
          matrix="[$(IFS=,; echo "${entries[*]}")]"
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "any=$([ ${#entries[@]} -gt 0 ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo "Building: $matrix"

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
        platform:
          - { name: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
          - { name: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out the Dockerfile
        uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: .github/docker

      - name: Check out ${{ matrix.target.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.sha }}
          path: src

      # identify.sh takes the branch name from git; a checkout by
      # revision is detached, so name the branch
      - name: Put the checkout on its branch
        working-directory: src
        run: git checkout -B "${{ matrix.target.branch }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: src
          file: ci/.github/docker/Dockerfile
          platforms: ${{ matrix.platform.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ matrix.target.sha }}
            org.opencontainers.image.title=CHICKEN Scheme (${{ matrix.target.branch }})
          outputs: type=image,name=${{ needs.plan.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target.branch }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.branch }}-${{ matrix.platform.arch }}

      - name: Record the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target.branch }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target.branch }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          BRANCH: ${{ matrix.target.branch }}
          REV: ${{ matrix.target.rev }}
        run: |
          tags=(-t "$IMAGE:$BRANCH" -t "$IMAGE:$BRANCH-$REV")
          if [ "$BRANCH" = main ]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$BRANCH-$REV"
